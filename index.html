<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4efe6">
<title>Nossa Jornada</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe6;--ink:#2f3446;--muted:#7d7a80;--coral:#e2725b;--mustard:#f0c05a;--teal:#5e9c97;--rose:#eaa6a0;--navy:#2f3a63;--line:#ddd5c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:20px/1.35 'Patrick Hand',system-ui,sans-serif;overflow-x:hidden;
  background-image:radial-gradient(rgba(47,52,70,.05) 1px,transparent 1.2px);background-size:7px 7px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:440px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom));min-height:100dvh;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.home{background:none;border:0;color:var(--muted);font-size:17px;padding:6px 2px}
.dots{display:flex;gap:5px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--line);transition:background .4s}
.dots i.on{background:var(--coral)}
.scene{animation:fade .7s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.kicker{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0}
.center{text-align:center}
h1{font:600 52px/1 Caveat,cursive;margin:4px 0 6px;color:var(--navy)}
h2{font:600 34px/1.05 Caveat,cursive;margin:4px 0 8px;color:var(--navy)}
.panel{background:#fff;padding:7px;border-radius:6px;margin:0 0 12px;position:relative;overflow:hidden}
.panel svg{display:block;width:100%;height:auto;border-radius:3px;touch-action:manipulation}
.cap{margin:2px 4px 12px;font-size:20px;min-height:27px}
.cap b{color:var(--coral);font-weight:400}
.tip{color:var(--muted);font-size:17px;text-align:center;margin:0 0 12px}
.next{display:block;margin:6px auto 0;background:none;border:0;font-size:26px;color:var(--coral);padding:8px 18px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.act{display:block;margin:4px auto 10px;background:var(--navy);color:var(--paper);border:0;border-radius:999px;padding:12px 26px;font-size:20px}
.act:active{transform:scale(.95)}
.act.ghost{background:none;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.hide{display:none!important}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* capa / menu */
.cover{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;justify-content:center;text-align:center}
.cover svg.emb{width:170px;margin:0 auto 16px}
.cover .sub{color:var(--muted);margin:0 0 22px}
.chapters{list-style:none;padding:0;margin:18px 0 8px}
.chapters li{margin:0 0 10px}
.chapters button{width:100%;display:flex;align-items:center;gap:14px;background:#fff;border:0;border-radius:6px;padding:10px 14px;text-align:left}
.chapters .n{font:600 34px/1 Caveat,cursive;color:var(--coral);width:26px;text-align:center}
.chapters b{display:block;font-weight:400;font-size:21px}
.chapters small{color:var(--muted);font-size:15px}
.chapters .st{margin-left:auto;font-size:17px;color:var(--muted)}
.chapters li.locked button{opacity:.5}
.chapters li.done .st{color:var(--teal)}
.chapters li.final button{background:var(--navy);color:var(--paper)}
.chapters li.final .n,.chapters li.final small{color:var(--mustard)}
.reset{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);font-size:15px;text-decoration:underline}

/* quebra-cabeça de conversa */
.bubble{position:relative;background:#fff;border-radius:22px;padding:14px 10px;margin:14px 0;min-height:76px;display:grid;place-items:center;max-width:100%;
  box-shadow:0 0 0 2px var(--ink);animation:fade .4s ease both}
.bubble::after{content:'';position:absolute;top:-12px;width:20px;height:20px;background:#fff;transform:rotate(45deg);box-shadow:-2px -2px 0 0 var(--ink)}
.bubble.l::after{left:48px} .bubble.r::after{right:48px}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;transition:opacity .5s}
.slot{height:40px;padding:0 10px;border:2px dashed #cfc8bd;border-radius:10px;color:transparent;display:grid;place-items:center;font-size:20px}
.slot.f{border-color:transparent;color:var(--ink);animation:pop .3s}
.said{position:absolute;inset:0;display:grid;place-items:center;font:600 34px Caveat,cursive;color:var(--coral);opacity:0;transition:opacity .6s;pointer-events:none;text-align:center;line-height:1}
.said small{display:block;font-size:20px;color:var(--muted)}
.said.on{opacity:1}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:50px;margin-bottom:8px}
.chip{height:44px;border:0;border-radius:10px;padding:0 14px;font-size:21px;color:var(--ink)}
.chip:active{transform:scale(.92)!important}
.chip.gone{visibility:hidden}

/* interações das cenas */
.tap{cursor:pointer}
.walk,.slide{transition:transform 1.1s cubic-bezier(.45,.05,.3,1)}
.gira{transform-origin:0 0;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.boing{animation:boing .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes boing{0%{transform:translateY(-26px)}60%{transform:translateY(4px)}100%{transform:translateY(0)}}
.store{cursor:pointer;transition:opacity .3s}
.store.dim{opacity:.35}
.flip{transition:transform 1s cubic-bezier(.5,0,.3,1)}
.lid{transition:transform .9s cubic-bezier(.5,0,.3,1),opacity .9s}
.petal{position:absolute;top:-20px;width:12px;height:9px;border-radius:60% 0;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),480px) rotate(400deg);opacity:.2}}

/* polaroids */
.pgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:6px 0 12px}
.pol{background:#fff;padding:7px 7px 4px;width:46%;border:0;box-shadow:0 8px 18px rgba(47,52,70,.16);position:relative}
.pol:nth-child(odd){transform:rotate(-3deg)} .pol:nth-child(even){transform:rotate(2.5deg)}
.pol .ph{width:100%;aspect-ratio:4/5;background:#e9e1d4;display:grid;place-items:center;color:var(--coral);font-size:34px;overflow:hidden}
.pol img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .6s ease both}
.pol p{margin:4px 0 0;font:600 18px/1.1 Caveat,cursive;color:var(--navy);min-height:20px;text-align:center}
.pol.big{width:84%;margin:4px auto 10px;display:block}
.pol.big p{font-size:24px;min-height:28px}

/* memória */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 12px}
.mcard{aspect-ratio:3/4;perspective:900px;border:0;padding:0;background:none}
.inner{position:relative;display:block;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mcard.flipd .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;overflow:hidden}
.front{background:#fff;display:grid;place-items:center;color:var(--coral);font-size:26px;box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 7px var(--line)}
.verso{transform:rotateY(180deg);background:#fff;padding:4px}
.verso img{width:100%;height:100%;object-fit:cover;display:block}
.mcard.match .inner{animation:pop .4s}

/* varal */
.varal{position:relative;height:150px;margin:6px 0 10px}
.varal::before{content:'';position:absolute;left:-8px;right:-8px;top:16px;height:40px;border-top:2px solid #8b6a52;border-radius:50%}
.varal .slotv{position:absolute;top:22px;width:23%;}
.varal .pin{position:absolute;left:50%;top:-10px;width:6px;height:18px;background:#b0714a;border-radius:2px;transform:translateX(-50%);z-index:2}
.varal .slotv .pol{width:100%;transform:rotate(var(--r))}
.varal .slotv .pol p{font-size:14px}
.ogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:6px 0 12px}
.ogrid .pol{width:100%}

/* cofre */
.digits{display:flex;gap:10px;justify-content:center;margin:6px 0}
.digit{width:50px;height:60px;border-radius:6px;background:#fff;display:grid;place-items:center;font-size:32px;color:var(--navy);box-shadow:inset 0 -3px 0 var(--line)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:270px;margin:12px auto 6px}
.key{height:54px;border-radius:6px;border:0;background:#fff;font-size:26px;color:var(--navy)}
.key:active{transform:scale(.93)}

/* quem */
.qbtns{display:flex;flex-direction:column;gap:9px;margin:4px 0 10px}
.qbtns button{background:#fff;border:0;border-radius:6px;padding:12px;font-size:20px;box-shadow:inset 0 0 0 2px var(--line)}
.qbtns button.sel{box-shadow:inset 0 0 0 2px var(--coral);color:var(--coral)}
.qbtns button:disabled{cursor:default}
.qbtns button.errada{opacity:.45;text-decoration:line-through}

/* raspadinha */
.scr{position:relative;width:100%;aspect-ratio:3/4;border-radius:3px;overflow:hidden}
.scr img{width:100%;height:100%;object-fit:cover;display:block}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .8s}
.scr canvas.gone{opacity:0;pointer-events:none}

/* cartas e final */
.letter{background:#fff;border-radius:6px;padding:20px 18px;margin:6px 0 14px;font:600 25px/1.3 Caveat,cursive;color:#3a3346;
  background-image:repeating-linear-gradient(transparent 0 31px,#efe6da 31px 32px)}
.letter p{margin:0 0 12px}
.letter .sign{text-align:right;color:var(--coral)}
.counter{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;margin:12px 0 4px}
.counter div{background:#fff;border-radius:6px;padding:8px 2px;text-align:center}
.counter b{display:block;font:600 34px/1 Caveat,cursive;color:var(--navy)}
.counter div:first-child b{color:var(--coral);font-size:40px}
.counter span{font-size:14px;color:var(--muted)}
.ask{position:relative;min-height:220px;text-align:center;padding:10px 0}
.askbtns{display:flex;gap:16px;justify-content:center;margin-top:14px}
.ask .no{transition:left .25s,top .25s}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(47,52,70,.5);display:grid;place-items:center;padding:20px;animation:fade .3s}
.overlay .box{background:var(--paper);border-radius:8px;padding:24px 20px;text-align:center;max-width:360px}
#musica{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;width:44px;height:44px;border-radius:50%;border:0;
  background:#fff;color:var(--coral);font-size:22px;box-shadow:0 4px 14px rgba(47,52,70,.18)}
#musica.off{color:var(--muted);text-decoration:line-through}
.float{position:fixed;pointer-events:none;color:var(--coral);font-size:24px;z-index:30;animation:up 1.8s ease-out forwards}
@keyframes up{to{transform:translateY(-140px) scale(1.4);opacity:0}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ======================= DESENHOS ======================= */
const HEART = 'M0 4 C0 0 -6 -2 -8 2 C-10 6 -4 10 0 14 C4 10 10 6 8 2 C6 -2 0 0 0 4 Z';
const heart = (x, y, s, c, extra = '') => `<path ${extra} transform="translate(${x} ${y}) scale(${s})" d="${HEART}" fill="${c}"/>`;
const starsAt = (pts, c = '#f6e7c1') => `<g fill="${c}">${pts.map(([x, y, r = 1.3]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>`;

function biel(o = {}) {
  const pele = '#e3b08e', cab = '#2d221e', cam = o.camisa || '#b0714a', calca = o.calca || '#3b4256';
  const bracos = o.semBracos ? '' : o.abertos
    ? `<rect x="-64" y="-114" width="42" height="10" rx="5" fill="${pele}"/><rect x="22" y="-114" width="42" height="10" rx="5" fill="${pele}"/>`
    : `<rect x="-31" y="-110" width="10" height="48" rx="5" fill="${pele}"/><rect x="21" y="-110" width="10" height="48" rx="5" fill="${pele}"/>`;
  const mangas = o.abertos
    ? `<rect x="-36" y="-116" width="18" height="14" rx="6" fill="${cam}"/><rect x="18" y="-116" width="18" height="14" rx="6" fill="${cam}"/>`
    : `<rect x="-33" y="-112" width="14" height="18" rx="6" fill="${cam}"/><rect x="19" y="-112" width="14" height="18" rx="6" fill="${cam}"/>`;
  const topo = o.gorro
    ? `<path d="M-21 -146 C-21 -170 21 -170 21 -146 Z" fill="#4a5375"/><rect x="-22" y="-152" width="44" height="9" rx="4" fill="#3b4256"/><circle cx="0" cy="-170" r="5" fill="#3b4256"/>`
    : `<path d="M-21 -138 C-24 -158 -12 -168 2 -167 C18 -166 25 -156 21 -138 C19 -146 13 -150 6 -150 C-4 -152 -14 -148 -21 -138 Z" fill="${cab}"/>
       <path d="M-8 -161 C0 -158 8 -157 16 -158" fill="none" stroke="#4a3a33" stroke-width="1.5" stroke-linecap="round"/>`;
  const olhos = o.feliz
    ? `<g fill="none" stroke="${cab}" stroke-width="2" stroke-linecap="round"><path d="M-10 -141 Q-7 -145 -4 -141"/><path d="M4 -141 Q7 -145 10 -141"/></g>`
    : `<circle cx="-7" cy="-142" r="2" fill="${cab}"/><circle cx="7" cy="-142" r="2" fill="${cab}"/>`;
  const oculos = o.oculos ? `<g fill="none" stroke="${cab}" stroke-width="1.6"><circle cx="-7.5" cy="-142" r="5.6"/><circle cx="7.5" cy="-142" r="5.6"/><path d="M-1.9 -142 L1.9 -142"/></g>` : '';
  return `
    <rect x="-14" y="-62" width="12" height="60" rx="4" fill="${calca}"/><rect x="2" y="-62" width="12" height="60" rx="4" fill="${calca}"/>
    <ellipse cx="-8" cy="0" rx="10" ry="4" fill="#2b2b2b"/><ellipse cx="8" cy="0" rx="10" ry="4" fill="#2b2b2b"/>
    ${bracos}
    <path d="M-24 -56 L-24 -104 C-24 -112 -18 -116 -10 -116 L10 -116 C18 -116 24 -112 24 -104 L24 -56 Z" fill="${cam}"/>
    ${mangas}
    <rect x="-5" y="-124" width="10" height="10" fill="${pele}"/>
    <circle cx="0" cy="-141" r="20" fill="#efc3a0"/>
    <path d="M-19 -141 C-19 -123 -10 -119 0 -119 C10 -119 19 -123 19 -141 C14 -133 8 -130 0 -130 C-8 -130 -14 -133 -19 -141 Z" fill="#3a2a24"/>
    ${o.feliz ? '<path d="M-5 -126 Q0 -121 5 -126 Z" fill="#fff"/>' : ''}
    ${topo}${olhos}${oculos}
    <circle cx="-12" cy="-135" r="3.2" fill="#e89a8a" opacity=".55"/><circle cx="12" cy="-135" r="3.2" fill="#e89a8a" opacity=".55"/>`;
}

function sah(o = {}) {
  const pele = '#f6d2b8', cab = '#7b4a33', roupa = o.roupa || '#f1e6d6', manga = o.manga || '#e8dccb';
  const pernas = o.semPernas ? '' : o.noiva ? '' : `
    <rect x="-11" y="-56" width="9" height="54" rx="4" fill="${o.calca || '#5b7fa6'}"/><rect x="2" y="-56" width="9" height="54" rx="4" fill="${o.calca || '#5b7fa6'}"/>
    <ellipse cx="-6" cy="0" rx="8" ry="3.5" fill="#efe7da"/><ellipse cx="6" cy="0" rx="8" ry="3.5" fill="#efe7da"/>`;
  const bracos = o.abertos
    ? `<rect x="-60" y="-100" width="42" height="9" rx="4.5" fill="${o.noiva ? pele : manga}"/><rect x="18" y="-100" width="42" height="9" rx="4.5" fill="${o.noiva ? pele : manga}"/>`
    : `<rect x="-27" y="-100" width="9" height="44" rx="4.5" fill="${o.noiva ? pele : manga}"/><rect x="18" y="-100" width="9" height="44" rx="4.5" fill="${o.noiva ? pele : manga}"/>
       <circle cx="-22.5" cy="-55" r="4.5" fill="${pele}"/><circle cx="22.5" cy="-55" r="4.5" fill="${pele}"/>`;
  const corpo = o.noiva
    ? `<path d="M-17 -104 C-11 -108 11 -108 17 -104 L19 -66 L34 -2 L-34 -2 L-19 -66 Z" fill="#fbf7f0"/><path d="M-19 -66 L19 -66" stroke="#e8dccb" stroke-width="2"/>`
    : `<path d="M-21 -52 L-19 -96 C-19 -103 -13 -106 -6 -106 L6 -106 C13 -106 19 -103 19 -96 L21 -52 Z" fill="${roupa}"/>`;
  const buque = o.buque ? `<g transform="translate(22 -56)"><circle cx="-4" cy="4" r="7" fill="#7aa36f"/><circle cx="4" cy="2" r="6" fill="#7aa36f"/><circle cx="-3" cy="-2" r="5" fill="#fff"/><circle cx="4" cy="-4" r="4.5" fill="#fff"/><circle cx="1" cy="3" r="4" fill="#f4d4d4"/></g>` : '';
  const gorro = o.gorro ? `<path d="M-20 -132 C-20 -154 20 -154 20 -132 Z" fill="#f4efe6"/><rect x="-21" y="-137" width="42" height="9" rx="4" fill="#e6dccb"/><circle cx="0" cy="-154" r="5.5" fill="#e6dccb"/>` : '';
  const olhos = o.feliz
    ? `<g fill="none" stroke="#3b241a" stroke-width="1.8" stroke-linecap="round"><path d="M-9 -127 Q-6 -131 -3 -127"/><path d="M3 -127 Q6 -131 9 -127"/></g>`
    : `<circle cx="-6" cy="-127" r="1.8" fill="#3b241a"/><circle cx="6" cy="-127" r="1.8" fill="#3b241a"/>`;
  return `${pernas}
    <path d="M-24 -130 C-26 -152 26 -152 24 -130 C27 -106 24 -96 20 -92 L-20 -92 C-24 -96 -27 -106 -24 -130 Z" fill="${cab}"/>
    ${bracos}${corpo}${buque}
    <rect x="-4" y="-112" width="8" height="8" fill="#f0c4a6"/>
    <circle cx="0" cy="-128" r="18" fill="${pele}"/>
    <path d="M-19 -124 C-22 -150 22 -152 19 -124 C16 -133 8 -137 -1 -136 C-9 -135 -16 -131 -19 -124 Z" fill="${cab}"/>
    ${gorro}${olhos}
    <path d="M-3 -119 Q0 -116 3 -119" fill="none" stroke="#b5523f" stroke-width="1.6" stroke-linecap="round"/>
    <g ${o.blushId ? `id="${o.blushId}"` : ''} fill="#e89a8a" opacity=".55"><circle cx="-10" cy="-121" r="3.2"/><circle cx="10" cy="-121" r="3.2"/></g>`;
}

/* Sah pulando no colo do Biel, de frente (vista por trás dela) */
function sahPulo() {
  const cab = '#7b4a33', jeans = '#5b7fa6';
  return `
    <g stroke="${jeans}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-36 -84 L-54 -72 L-46 -57"/><path d="M2 -84 L30 -72 L24 -57"/></g>
    <ellipse cx="-46" cy="-55" rx="7" ry="4" fill="#efe7da"/><ellipse cx="24" cy="-55" rx="7" ry="4" fill="#efe7da"/>
    <path d="M-46 -116 C-44 -124 -36 -127 -24 -127 L-6 -125 C2 -123 6 -118 6 -112 L4 -82 L-40 -82 Z" fill="#f1e6d6"/>
    <path d="M0 -118 C10 -128 18 -126 23 -116" fill="none" stroke="#e8dccb" stroke-width="9" stroke-linecap="round"/>
    <path d="M-47 -142 C-51 -118 -47 -100 -41 -92 C-34 -96 -26 -90 -20 -94 C-16 -104 -13 -126 -14 -142 Z" fill="${cab}"/>
    <circle cx="-30" cy="-142" r="18" fill="${cab}"/>
    <path d="M27 -104 C21 -96 11 -94 0 -97" fill="none" stroke="#e3b08e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-31" cy="-99" r="5" fill="#e3b08e"/>`;
}

/* retrato (capa do jogo e resposta do pedido) */
function retrato(oculos = false, anel = false, guardanapo = false) {
  return `<svg viewBox="350 20 310 400" role="img" aria-label="Biel e Sah sorrindo, ela com a cabeça no ombro dele">
    <rect x="350" y="20" width="310" height="400" fill="#f3dccd"/><circle cx="505" cy="210" r="125" fill="#ebbfae"/><rect x="350" y="370" width="310" height="50" fill="#e4b9a5"/>
    ${heart(395, 80, 1.4, '#e07a7a')}${heart(618, 100, 1.1, '#f2cc8f')}${heart(596, 52, .8, '#e07a7a')}
    <path d="M478 420 C480 362 508 340 550 340 C592 340 620 362 622 420 Z" fill="#b0714a"/>
    <rect x="538" y="300" width="24" height="46" fill="#e3b08e"/>
    <ellipse cx="503" cy="262" rx="7" ry="10" fill="#e3b08e"/><ellipse cx="597" cy="262" rx="7" ry="10" fill="#e3b08e"/>
    <ellipse cx="550" cy="255" rx="46" ry="54" fill="#efc3a0"/>

function hearts(el, n = 6) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const h = document.createElement('span'); h.className = 'float'; h.textContent = '♥';
    h.style.left = r.left + r.width * (.15 + Math.random() * .7) + 'px'; h.style.top = r.top + r.height * .45 + 'px';
    h.style.animationDelay = i * .12 + 's'; document.body.appendChild(h); setTimeout(() => h.remove(), 2600);
  }
}
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
const scrollEnd = node => setTimeout(() => node.scrollIntoView({ behavior: 'smooth', block: 'end' }), 200);

/* cena padrão: painel + legenda + dica */

  return { svg: host.querySelector('svg'), cap: host.querySelector('.cap'), tip: host.querySelector('.tip') };
}

/* monte a frase: toque nas palavras na ordem certa */
const PCOLORS = ['#e2725b', '#f0c05a', '#5e9c97', '#eaa6a0', '#7d8fb3'];
function frase(host, { palavras, side = 'l', dica, final }, done) {
  const wrap = el(`<div>${dica ? `<p class="tip">${dica}</p>` : ''}<div class="bubble ${side}"><div class="slots">${palavras.map((p, i) => `<span class="slot" data-i="${i}">${p}</span>`).join('')}</div>${final ? `<div class="said">${final}</div>` : ''}</div>
    <div class="tray">${shuffle(palavras.map((p, i) => ({ p, i }))).map(x => `<button class="chip" data-p="${x.p}" style="background:${PCOLORS[x.i % PCOLORS.length]};transform:rotate(${(Math.random() * 8 - 4).toFixed(1)}deg)">${x.p}</button>`).join('')}</div></div>`);
  host.appendChild(wrap);
  const tip = wrap.querySelector('.tip'), slots = wrap.querySelectorAll('.slot');
  let k = 0;
  wrap.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    if (b.dataset.p !== palavras[k]) {
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      if (tip) tip.textContent = pick(['Tem certeza? 👀', 'Hmm, não é essa ainda 🤔', 'Quase! Qual vem agora?']);
      return;
    }
    slots[k].classList.add('f'); slots[k].style.background = b.style.background; b.classList.add('gone'); k++;
    if (k < palavras.length) return;
    setTimeout(() => {
      wrap.querySelector('.tray').remove(); tip?.remove();
      if (final) { wrap.querySelector('.slots').style.opacity = 0; wrap.querySelector('.said').classList.add('on'); }
      hearts(wrap.querySelector('.bubble'), 5); done && done();
    }, 500);
  });
  scrollEnd(wrap);
}

/* raspadinha de céu estrelado */
function raspadinha(host, foto, legenda, done) {
  const wrap = el(`<div><p class="tip">raspe com o dedo</p><div class="panel"><div class="scr"><img src="${FOTO(foto)}" alt=""><canvas></canvas></div></div><p class="cap center hide">${legenda}</p></div>`);
  host.appendChild(wrap);
  const box = wrap.querySelector('.scr'), cv = box.querySelector('canvas'), g = cv.getContext('2d');
  const d = devicePixelRatio || 1, r = box.getBoundingClientRect();
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  g.fillStyle = '#2f3a63'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#f6e7c1';
  for (let i = 0; i < 70; i++) { g.beginPath(); g.arc(Math.random() * cv.width, Math.random() * cv.height, (Math.random() * 1.8 + .6) * d, 0, 7); g.fill(); }
  g.textAlign = 'center'; g.fillStyle = '#e2725b'; g.font = `${64 * d}px Caveat, cursive`; g.fillText('♥', cv.width / 2, cv.height / 2);
  g.fillStyle = '#f4efe6'; g.font = `${26 * d}px 'Patrick Hand', sans-serif`; g.fillText('raspe aqui', cv.width / 2, cv.height / 2 + 44 * d);
  g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 58 * d;
  let down = false, last = null, moves = 0, fin = false;
  const pos = e => { const b = cv.getBoundingClientRect(), k = cv.width / b.width; return [(e.clientX - b.left) * k, (e.clientY - b.top) * k]; };
  const dig = p => { g.beginPath(); g.moveTo(...(last || p)); g.lineTo(p[0] + .1, p[1]); g.stroke(); last = p; if (++moves % 8 === 0) check(); };
  cv.addEventListener('pointerdown', e => { down = true; last = null; cv.setPointerCapture(e.pointerId); dig(pos(e)); });
  cv.addEventListener('pointermove', e => { if (down) dig(pos(e)); });
  const up = () => { down = false; last = null; check(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  function check() {
    if (fin) return;
    const data = g.getImageData(0, 0, cv.width, cv.height).data;
    let c = 0, t = 0;
    for (let i = 3; i < data.length; i += 4 * 37) { t++; if (data[i] === 0) c++; }
    if (c / t > .5) { fin = true; cv.classList.add('gone'); hearts(box, 6); wrap.querySelector('.tip').remove(); wrap.querySelector('.cap').classList.remove('hide'); done && done(); }
  }
  scrollEnd(wrap);
}

  function vibra(m, t) {
    const o = ctx.createOscillator(), a = ctx.createGain();
    o.frequency.value = mtof(m); o.connect(a); a.connect(bus); env(a, t, .03, t + .8);
    o.start(t); o.stop(t + .85);
  }
  function tempo(n, t) {
    const c = PROG[Math.floor(n / 4) % PROG.length], p = n % 4;
    baixo(c.b[p], t);
    prato(t, p % 2 ? .022 : .016);
    if (p % 2) prato(t + SW * B, .012);
    if (p === 0) c.v.forEach(m => rhodes(m, t + Math.random() * .015, B * .9));
    if (p === 1 && Math.random() < .7) c.v.forEach(m => rhodes(m, t + SW * B, B * .35, .035));
    if (p === 3 && Math.random() < .35) c.v.forEach(m => rhodes(m, t + SW * B, B * .3, .03));
    for (const off of [0, SW]) if (Math.random() < .22) {
      mel = Math.max(0, Math.min(ESCALA.length - 1, mel + Math.floor(Math.random() * 5) - 2));
      vibra(ESCALA[mel], t + off * B);
    }
  }
  function loop() { while (t0 < ctx.currentTime + .6) { tempo(beat, t0); t0 += B; beat++; } }
  function tocar() {
    if (!ctx) grafo();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ctx.resume();
    if (on) return;
    on = true; t0 = ctx.currentTime + .1;
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.8, ctx.currentTime + 2.5);
    timer = setInterval(loop, 50); loop();
  }
  function parar() {
    if (!on) return;
    on = false; clearInterval(timer);
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + .6);
  }
  function init() {
    const btn = document.createElement('button');
    btn.id = 'musica'; btn.textContent = '♪'; btn.setAttribute('aria-label', 'ligar ou desligar a música');
    btn.classList.toggle('off', !quer);
    document.body.appendChild(btn);
    btn.onclick = e => {
      e.stopPropagation(); quer = !quer; btn.classList.toggle('off', !quer);
      try { localStorage.setItem(PREF, quer ? 'on' : 'off'); } catch (er) {}
      quer ? tocar() : parar();
    };
    document.addEventListener('pointerdown', function primeiro(e) {
      if (e.target === btn) return;
      document.removeEventListener('pointerdown', primeiro, true);
      if (quer) tocar();
    }, true);
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else if (quer && on) ctx.resume();
    });
  }
  return { init, tocar, parar, get tocando() { return on; } };
})();

/* ---------- navegação ---------- */
function home() {
  clearTimers();
  const n = S.done.length, all = n === CAPS.length;
  app.innerHTML = `<section class="scene">
    <div class="panel" style="margin-top:6px">${retrato()}</div>
    <p class="kicker center">02.11.2021 → 02.11.2026</p>
    <h1 class="center">Nossa Jornada</h1>
    <p class="tip">5 anos, 5 capítulos. Para Sah, com amor, Biel.</p>
    <ol class="chapters">${CAPS.map((c, i) => {
      const done = S.done.includes(c.id), open = i === 0 || S.done.includes(CAPS[i - 1].id);
      return `<li class="${done ? 'done' : open ? '' : 'locked'}"><button data-i="${i}"><span class="n">${i + 1}</span><span><b>${c.titulo}</b><small>${c.ano}</small></span><span class="st">${done ? '✓' : open ? '→' : '🔒'}</span></button></li>`;
    }).join('')}
      <li class="final ${all ? '' : 'locked'}"><button data-i="final"><span class="n">♥</span><span><b>5 anos</b><small>${all ? 'a surpresa final' : 'termine os capítulos'}</small></span><span class="st">${all ? '→' : '🔒'}</span></button></li>
    </ol>
    ${n ? '<button class="reset" id="reset">recomeçar do zero</button>' : ''}
  </section>`;
  window.scrollTo(0, 0);
  app.querySelectorAll('.chapters button').forEach(b => b.onclick = () => {
    const i = b.dataset.i;
    if (i === 'final') return all ? final() : hearts(b, 2);
    if (+i > 0 && !S.done.includes(CAPS[+i - 1].id)) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
    capitulo(+i);
  });
  const r = app.querySelector('#reset'); if (r) r.onclick = () => { if (confirm('Recomeçar a jornada do zero?')) { S = { done: [] }; save(); home(); } };
}

function capitulo(ci) {
  clearTimers();
  const cap = CAPS[ci], total = cap.cenas.length + 2;
  app.innerHTML = `<div class="top"><button class="home" id="toHome">← capítulos</button><nav class="dots">${'<i></i>'.repeat(total)}</nav></div><div id="stage"></div>`;
  app.querySelector('#toHome').onclick = home;
  const stage = app.querySelector('#stage'), dots = [...app.querySelectorAll('.dots i')];
  let si = -1;
  const next = () => {
    si++;
    dots.forEach((d, i) => d.classList.toggle('on', i <= si));
    stage.innerHTML = ''; window.scrollTo(0, 0);
    const s = el('<section class="scene"></section>'); stage.appendChild(s);
    if (si === 0) {
      s.innerHTML = `<div class="cover">${EMBS[ci]}<p class="kicker">Capítulo ${ci + 1}</p><h1>${cap.titulo}</h1><p class="sub">${cap.sub}</p><button class="act">começar →</button></div>`;
      s.querySelector('.act').onclick = next;
    } else if (si <= cap.cenas.length) {
      cap.cenas[si - 1](s, () => { const b = el('<button class="next" aria-label="continuar">→</button>'); b.onclick = next; s.appendChild(b); scrollEnd(b); });
    } else {
      if (!S.done.includes(cap.id)) { S.done.push(cap.id); save(); }
      const ultimo = ci === CAPS.length - 1;
      s.innerHTML = `<p class="kicker center">uma carta pra você</p><article class="letter">${paras(cap.carta)}<p class="sign">Com amor, Biel</p></article>
        <button class="act">${ultimo ? 'abrir a surpresa final ♥' : `capítulo ${ci + 2} →`}</button><button class="home" style="display:block;margin:0 auto">voltar aos capítulos</button>`;
      s.querySelector('.act').onclick = () => ultimo ? final() : capitulo(ci + 1);
      s.querySelector('.home').onclick = home;
    }
  };
  next();
}

musica.init();
home();
</script>
